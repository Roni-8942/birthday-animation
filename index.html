<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Animated background -->
    <div class="background"></div>

    <!-- Stars -->
    <div id="stars"></div>

    <!-- Floating hearts -->
    <div id="floating-hearts"></div>

    <!-- Birthday message -->
    <div class="birthday">
        <div class="small-title">A little something for you...</div>

        <h1>Happy Birthday</h1>

        <div class="name">❤️ My Special Person ❤️</div>
    </div>


    <!-- Heart -->
    <div id="heart"></div>


    <!-- Poetry -->
    <div class="poetry">

        <span>
            Among a thousand hearts,
        </span>

        <span>
            mine still beats only for you...
        </span>

        <span class="signature">
            — With all my heart ❤️
        </span>

    </div>


    <script src="script.js"></script>

</body>
</html>
